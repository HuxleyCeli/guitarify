<!--
  Ícono de Guitarify: una uñeta (púa) roja con borde dorado y un rayo blanco.
  Diseño original. Aparece en la pestaña del navegador.
  (Los colores van escritos aquí directamente porque un archivo de ícono
  externo no puede leer las variables de css/estilos.css.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110">
  <!-- Uñeta de afuera: dorada (hace de borde) -->
  <path d="M50 108C38 100 4 62 2 34 1 12 22 2 50 2s49 10 48 32c-2 28-36 66-48 74z" fill="#d4af37"/>
  <!-- Uñeta de adentro: roja, un poco más chica -->
  <path d="M50 100C40 93 10 60 8.5 35 7.5 16 26 8.5 50 8.5s42.5 7.5 41.5 26.5C90 60 60 93 50 100z" fill="#c8102e"/>
  <!-- El rayo blanco del centro -->
  <path d="M57 17 32 58h16l-6 33 28-45H54z" fill="#f5f1e8"/>
</svg>
